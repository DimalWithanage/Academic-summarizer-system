name: Deploy to Google Cloud Run

# ── Trigger: deploy on every push to main branch ──────────────────────
on:
  push:
    branches: [ "main" ]

# ── Environment variables shared across all jobs ───────────────────────
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}        # e.g. academic-summarizer-system
  REGION: asia-south1                               # Mumbai region (closest to Sri Lanka/India)
  BACKEND_SERVICE: academic-summarizer-backend      # Cloud Run service name for backend
  FRONTEND_SERVICE: academic-summarizer-frontend    # Cloud Run service name for frontend
  ARTIFACT_REGISTRY: asia-south1-docker.pkg.dev    # Artifact Registry host

jobs:
  # ────────────────────────────────────────────────────────────────────
  # JOB 1 – Build & Deploy Spring Boot Backend to Cloud Run
  # ────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud using Service Account key stored in GitHub Secrets
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up the gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4. Configure Docker to push to Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      # 5. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 6. Build the Spring Boot JAR (skip tests for speed; tests ran separately)
      - name: Build Spring Boot JAR
        run: mvn -B package -DskipTests --file backend/pom.xml

      # 7. Build Docker image and push to Artifact Registry
      - name: Build & Push Docker Image
        run: |
          IMAGE_URI="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/academic-summarizer/${{ env.BACKEND_SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # 8. Deploy to Cloud Run — all API keys injected as environment variables
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "${{ env.IMAGE_URI }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod" \
            --set-env-vars "SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}" \
            --set-env-vars "SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}" \
            --set-env-vars "SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}" \
            --set-env-vars "GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}" \
            --set-env-vars "GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}" \
            --set-env-vars "GOOGLE_DRIVE_REFRESH_TOKEN=${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}"

      # 9. Print the live backend URL
      - name: Get Backend URL
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "✅ Backend live at: $URL"

  # ────────────────────────────────────────────────────────────────────
  # JOB 2 – Deploy Static Frontend to Firebase Hosting
  # ────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    needs: deploy-backend   # wait for backend URL first

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Inject the live backend Cloud Run URL into frontend JS config
      - name: Set Backend API URL in frontend JS
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format "value(status.url)" 2>/dev/null || echo "${{ secrets.BACKEND_URL }}")
          # Replace localhost URL with production Cloud Run URL in app.js
          sed -i "s|http://localhost:8080/api|${BACKEND_URL}/api|g" frontend/js/app.js
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.PROJECT_ID }}

      # Deploy the frontend folder to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.PROJECT_ID }}

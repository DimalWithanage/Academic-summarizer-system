name: Deploy to Google Cloud Run

# ── Trigger: deploy on every push to main branch ──────────────────────
on:
  push:
    branches: [ "main" ]

# ── Environment variables shared across all jobs ───────────────────────
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  BACKEND_SERVICE: academic-summarizer-backend
  ARTIFACT_REGISTRY: asia-south1-docker.pkg.dev

jobs:
  # ────────────────────────────────────────────────────────────────────
  # JOB 1 – Build & Deploy Spring Boot Backend to Cloud Run
  # ────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up the gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4. Configure Docker to push to Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      # 5. Build Docker image and push to Artifact Registry
      #    (Docker builds the JAR internally via the multi-stage Dockerfile —
      #     no separate Maven step needed on the runner)
      - name: Build & Push Docker Image
        run: |
          IMAGE_URI="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/academic-summarizer/${{ env.BACKEND_SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # 6. Deploy to Cloud Run — dynamically pass configured env vars (ignores empty secrets)
      - name: Deploy Backend to Cloud Run
        run: |
          ENV_VARS="SPRING_PROFILES_ACTIVE=prod"

          if [ -n "${{ secrets.DB_URL }}" ]; then
            ENV_VARS="$ENV_VARS,SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}"
            ENV_VARS="$ENV_VARS,SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver"
            ENV_VARS="$ENV_VARS,SPRING_JPA_PLATFORM=org.hibernate.dialect.MySQLDialect"
          fi

          if [ -n "${{ secrets.DB_USERNAME }}" ]; then
            ENV_VARS="$ENV_VARS,SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}"
          fi

          if [ -n "${{ secrets.DB_PASSWORD }}" ]; then
            ENV_VARS="$ENV_VARS,SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}"
          fi

          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            ENV_VARS="$ENV_VARS,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          fi

          if [ -n "${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}" ]; then
            ENV_VARS="$ENV_VARS,GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}"
          fi

          if [ -n "${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}" ]; then
            ENV_VARS="$ENV_VARS,GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}"
          fi

          if [ -n "${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}" ]; then
            ENV_VARS="$ENV_VARS,GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}"
          fi

          if [ -n "${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}" ]; then
            ENV_VARS="$ENV_VARS,GOOGLE_DRIVE_REFRESH_TOKEN=${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}"
          fi

          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "$IMAGE_URI" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --cpu-boost \
            --set-env-vars "$ENV_VARS"

      # 7. Print the live backend URL
      - name: Print Backend URL
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "✅ Backend live at: $URL"
          echo "BACKEND_URL=$URL" >> $GITHUB_ENV

  # ────────────────────────────────────────────────────────────────────
  # JOB 2 – Deploy Static Frontend to Firebase Hosting
  # ────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to GCP to be able to query the Cloud Run URL
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Replace localhost API URL in app.js with the live Cloud Run URL
      - name: Inject Backend URL into frontend
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "Injecting backend URL: $BACKEND_URL"
          sed -i "s|http://localhost:8080/api|${BACKEND_URL}/api|g" frontend/js/app.js

      # Deploy frontend/ folder to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.PROJECT_ID }}

# ==========================================
# Spring Boot Production Configuration
# All sensitive values are injected at
# runtime via Google Cloud Run env vars.
# ==========================================

spring.application.name=academic-summarizer
server.port=8080

# ── Database Configuration ────────────────────────────────────────────
# MySQL is the primary production database.
# Injected via Cloud Run environment variables (SPRING_DATASOURCE_URL, DB_USERNAME, DB_PASSWORD).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/academic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# ── JPA / Hibernate (MySQL Dialect) ───────────────────────────────────
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 web console in production (security)
spring.h2.console.enabled=false

# ── Gemini API Key ────────────────────────────────────────────────────
# Injected via Cloud Run environment variable GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# ── Google Drive (OAuth2 — no service_account.json needed) ───────────
# credentialsPath is blank so the app uses OAuth2 flow directly
google.drive.credentials.path=
google.drive.folder.id=${GOOGLE_DRIVE_FOLDER_ID:}
google.drive.oauth2.client.id=${GOOGLE_DRIVE_CLIENT_ID:}
google.drive.oauth2.client.secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
google.drive.oauth2.refresh.token=${GOOGLE_DRIVE_REFRESH_TOKEN:}

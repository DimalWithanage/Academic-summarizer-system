# ==========================================
# Spring Boot Production Configuration
# Values here are DEFAULT PLACEHOLDERS.
# All sensitive values are injected at
# runtime via Google Cloud Run env vars.
# ==========================================

spring.application.name=academic-summarizer
server.port=8080

# ── Database (Cloud SQL MySQL via Cloud Run connector) ──────────────
# Cloud Run will set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# and SPRING_DATASOURCE_PASSWORD as environment variables automatically.
# These placeholders are overridden at runtime; do NOT commit real values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/academic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# ── JPA / Hibernate ──────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# ── Gemini & Google Cloud API Keys ──────────────────────────────────
# Injected via Cloud Run environment variable GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# Google Drive – path to service account JSON mounted as a secret
google.drive.credentials.path=${GOOGLE_DRIVE_CREDENTIALS_PATH:backend/src/main/resources/service_account.json}
google.drive.folder.id=${GOOGLE_DRIVE_FOLDER_ID:YOUR_FOLDER_ID}

# Google Drive OAuth2 (if used)
google.drive.oauth2.client.id=${GOOGLE_DRIVE_CLIENT_ID:YOUR_CLIENT_ID}
google.drive.oauth2.client.secret=${GOOGLE_DRIVE_CLIENT_SECRET:YOUR_CLIENT_SECRET}
google.drive.oauth2.refresh.token=${GOOGLE_DRIVE_REFRESH_TOKEN:YOUR_REFRESH_TOKEN}

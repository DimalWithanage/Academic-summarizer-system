# ==========================================
# Spring Boot Production Configuration
# All sensitive values are injected at
# runtime via Google Cloud Run env vars.
# ==========================================

spring.application.name=academic-summarizer
server.port=8080

# ── Database Configuration ────────────────────────────────────────────
# Default to H2 in-memory so Cloud Run container boots up safely without crashing if DB secrets are missing.
# When SPRING_DATASOURCE_URL, SPRING_DATASOURCE_DRIVER, and SPRING_JPA_PLATFORM are injected via Cloud Run env vars, it switches to MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:acasumdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# ── JPA / Hibernate ──────────────────────────────────────────────────
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 web console in production (security)
spring.h2.console.enabled=false

# ── Gemini API Key ────────────────────────────────────────────────────
# Injected via Cloud Run environment variable GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# ── Google Drive (OAuth2 — no service_account.json needed) ───────────
# credentialsPath is blank so the app uses OAuth2 flow directly
google.drive.credentials.path=
google.drive.folder.id=${GOOGLE_DRIVE_FOLDER_ID:}
google.drive.oauth2.client.id=${GOOGLE_DRIVE_CLIENT_ID:}
google.drive.oauth2.client.secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
google.drive.oauth2.refresh.token=${GOOGLE_DRIVE_REFRESH_TOKEN:}
